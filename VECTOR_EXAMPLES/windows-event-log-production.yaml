# Vector Configuration: Windows Event Log - PRODUCTION
# Collect Windows Event Log and send to O.A.S.I.S. via HTTPS with TLS
# 
# IMPORTANT: This file is auto-generated by the deployment script.
# For automated deployment, run PowerShell as Administrator:
#   .\scripts\deploy-vector.ps1
#
# Manual deployment instructions (if not using script):
# 1. Download Vector MSI from: https://vector.dev/download/
# 2. Install Vector MSI
# 3. Copy this file to: C:\ProgramData\Vector\config\vector.yaml
# 4. Create secrets file at: C:\ProgramData\Vector\config\secrets.json 
#    with: {"oasis_api_key": "your_key_here"}
# 5. Copy CA certificate to: C:\ProgramData\Vector\config\certs\oasis-ca.pem
# 6. Install Windows Service: vector service install --config C:\ProgramData\Vector\config\vector.yaml
# 7. Start service: Start-Service Vector

# Secrets backend (file-based for security)
secret:
  oasis_secrets:
    type: file
    path: "C:\\ProgramData\\Vector\\config\\secrets.json"

# Data source: Windows Event Log
sources:
  windows_events:
    type: windows_event_log
    channels:
      - Application
      - System
      - Security

# Transform: Enrich and filter
transforms:
  enrich_events:
    type: remap
    inputs:
      - windows_events
    source: |
      .host, _ = get_hostname()
      .oasis_tenant = "internal"
      .timestamp = to_unix_timestamp(now())
      .source_type = "windows_event_log"
      .severity = .Level
      .channel = .Channel
      .event_id = .EventID
      .message = .Message

  filter_severity:
    type: filter
    inputs:
      - enrich_events
    condition: 'to_int(.Level) <= 4'

# Sink: O.A.S.I.S. Internal Gateway
sinks:
  oasis_gateway:
    type: http
    inputs:
      - filter_severity
    uri: https://192.168.5.32:8444/api/v1/ingest
    method: post
    compression: gzip
    encoding:
      codec: json
    batch:
      max_bytes: 1048576
      timeout_secs: 5
    request:
      headers:
        Authorization: "Bearer SECRET[oasis_secrets.oasis_api_key]"
        Content-Type: "application/json"
    tls:
      ca_file: "C:\\ProgramData\\Vector\\config\\certs\\oasis-ca.pem"
      verify_certificate: true
      verify_hostname: true
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
