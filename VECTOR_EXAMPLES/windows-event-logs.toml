# Vector Configuration Example: Windows Event Log
# Collect Windows Event Logs (Security, System, Application) and send to O.A.S.I.S.

# Data source: Windows Event Log
[sources.windows_events]
type = "windows_event_log"
channels = ["Security", "System", "Application"]
max_read_bytes = 65536

# Transform: Add metadata
[transforms.add_metadata]
type = "remap"
inputs = ["windows_events"]
source = '''
  .host = get_hostname()
  .oasis_tenant = "acme-corp"  # Replace with your tenant name
  .timestamp = to_unix_timestamp(now())
  .source_type = "windows_event_log"
'''

# Sink: Send to O.A.S.I.S. External Gateway
[sinks.oasis_gateway]
type = "http"
inputs = ["add_metadata"]
uri = "https://external-gateway.oasis-siem.com/ingest"  # Replace with your gateway URL
method = "post"
compression = "gzip"
encoding.codec = "json"
batch.max_bytes = 1048576  # 1MB
batch.timeout_secs = 5

# Authentication: API key header
[sinks.oasis_gateway.request.headers]
X-API-Key = "${OASIS_API_KEY}"  # Set via environment variable
Content-Type = "application/json"

# TLS: Trust O.A.S.I.S. self-signed CA
[sinks.oasis_gateway.tls]
ca_file = "C:\\Program Files\\Vector\\certs\\oasis-ca.pem"  # Download from O.A.S.I.S. UI
verify_certificate = true
verify_hostname = true

# Buffer: Local disk buffer for reliability
[sinks.oasis_gateway.buffer]
type = "disk"
max_size = 268435456  # 256MB
when_full = "block"
