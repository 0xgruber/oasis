# Vector Configuration: macOS Unified Log - PRODUCTION
# Collect macOS Unified Log and send to O.A.S.I.S. via HTTPS with TLS
# 
# Deployment Instructions:
# 1. Install Vector: brew install vector
# 2. Copy this file to /usr/local/etc/vector/vector.toml
# 3. Copy CA certificate to /usr/local/etc/vector/certs/oasis-ca.pem
# 4. Set environment variable: export OASIS_API_KEY="oasis_pk_FfCjHivG-Q-QN2lBD7Dl6-YQtoPaPnKEJsqXVLEkWwo"
# 5. Start Vector: brew services start vector

# Data source: macOS Unified Log (via `log show`)
[sources.macos_log]
type = "exec"
command = ["log", "show", "--style", "json", "--predicate", "eventType == logEvent OR eventType == activityCreateEvent", "--last", "1m"]
mode = "scheduled"
scheduled.exec_interval_secs = 60  # Run every 60 seconds

# Transform: Parse JSON and add metadata
[transforms.parse_macos_log]
type = "remap"
inputs = ["macos_log"]
source = '''
  parsed, err = parse_json(.message)
  if err == null {
    .timestamp = parsed.timestamp
    .subsystem = parsed.subsystem
    .category = parsed.category
    .message_text = parsed.eventMessage
    .log_type = parsed.messageType
    .process = parsed.processImagePath
  }
  .host = get_hostname()
  .oasis_tenant = "internal"
  .source_type = "macos_unified_log"
'''

# Transform: Filter out excessive system noise (relaxed for more logs)
[transforms.filter_noise]
type = "filter"
inputs = ["parse_macos_log"]
condition = '''
  .subsystem != "com.apple.system.logger" && 
  .log_type != "debug"
'''

# Sink: Send to O.A.S.I.S. Internal Gateway via HTTPS
[sinks.oasis_gateway]
type = "http"
inputs = ["filter_noise"]
uri = "https://192.168.5.32:8444/api/v1/ingest"
method = "post"
compression = "gzip"
encoding.codec = "json"
batch.max_bytes = 1048576  # 1MB
batch.timeout_secs = 5

# Authentication: Bearer token (API key)
[sinks.oasis_gateway.request.headers]
Authorization = "Bearer ${OASIS_API_KEY}"
Content-Type = "application/json"

# TLS: Verify O.A.S.I.S. CA certificate
[sinks.oasis_gateway.tls]
ca_file = "/usr/local/etc/vector/certs/oasis-ca.pem"
verify_certificate = true
verify_hostname = true

# Buffer: Local disk buffer for reliability
[sinks.oasis_gateway.buffer]
type = "disk"
max_size = 268435456  # 256MB
when_full = "block"
