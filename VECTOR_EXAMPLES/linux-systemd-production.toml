# Vector Configuration: Linux Systemd Journal - PRODUCTION
# Collect systemd journal logs and send to O.A.S.I.S. via HTTPS with TLS
# 
# IMPORTANT: Use the automated deployment script for easiest installation:
#   sudo bash scripts/deploy-vector.sh
#
# Manual deployment instructions (if not using script):
# 1. Install Vector via official installer:
#    curl --proto '=https' --tlsv1.2 -sSfL https://sh.vector.dev | bash
# 2. Copy this file to /etc/vector/vector.yaml
# 3. Create secrets file at /etc/vector/secrets.json with: {"oasis_api_key": "your_key_here"}
# 4. Copy CA certificate to /etc/vector/certs/oasis-ca.pem
# 5. Create systemd unit at /etc/systemd/system/vector.service
# 6. Enable with: sudo systemctl enable --now vector.service

# Secrets backend (file-based for security)
[secret.oasis_secrets]
type = "file"
path = "/etc/vector/secrets.json"

# Data source: Systemd journal (ALL services)
[sources.journald]
type = "journald"
current_boot_only = true
# Collect from all systemd units (removed units filter)

# Transform: Add metadata and enrich
[transforms.enrich_journal]
type = "remap"
inputs = ["journald"]
source = '''
  .host = get_hostname()
  .oasis_tenant = "internal"
  .timestamp = to_unix_timestamp(now())
  .source_type = "systemd_journal"
  .severity = .PRIORITY
  .unit = ._SYSTEMD_UNIT
  .message = .MESSAGE
'''

# Transform: Filter by priority (collect warnings and higher)
[transforms.filter_priority]
type = "filter"
inputs = ["enrich_journal"]
condition = 'to_int(.PRIORITY) <= 6'  # 0=emerg, 1=alert, 2=crit, 3=err, 4=warning, 5=notice, 6=info

# Sink: Send to O.A.S.I.S. Internal Gateway via HTTPS
[sinks.oasis_gateway]
type = "http"
inputs = ["filter_priority"]
uri = "https://192.168.5.32:8444/api/v1/ingest"
method = "post"
compression = "gzip"
encoding.codec = "json"
batch.max_bytes = 1048576  # 1MB
batch.timeout_secs = 5

# Authentication: Bearer token from secrets file
[sinks.oasis_gateway.request.headers]
Authorization = "Bearer SECRET[oasis_secrets.oasis_api_key]"
Content-Type = "application/json"

# TLS: Verify O.A.S.I.S. CA certificate
[sinks.oasis_gateway.tls]
ca_file = "/etc/vector/certs/oasis-ca.pem"
verify_certificate = true
verify_hostname = true

# Buffer: Local disk buffer for reliability
[sinks.oasis_gateway.buffer]
type = "disk"
max_size = 268435456  # 256MB
when_full = "block"
