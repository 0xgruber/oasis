# Vector Configuration Example: Linux Syslog
# Collect Linux syslog messages and send to O.A.S.I.S.

# Data source: Syslog file
[sources.linux_syslog]
type = "file"
include = ["/var/log/syslog", "/var/log/messages", "/var/log/auth.log"]
read_from = "end"  # Only new messages

# Transform: Parse syslog format
[transforms.parse_syslog]
type = "remap"
inputs = ["linux_syslog"]
source = '''
  parsed, err = parse_syslog(.message)
  if err == null {
    .timestamp = parsed.timestamp
    .severity = parsed.severity
    .facility = parsed.facility
    .hostname = parsed.hostname
    .app_name = parsed.appname
    .message = parsed.message
  }
  .host = get_hostname()
  .oasis_tenant = "internal"  # Replace with your tenant name
  .source_type = "linux_syslog"
'''

# Transform: Filter out low-priority logs (optional)
[transforms.filter_debug]
type = "filter"
inputs = ["parse_syslog"]
condition = '.severity != "debug" && .severity != "info"'

# Sink: Send to O.A.S.I.S. Internal Gateway
[sinks.oasis_gateway]
type = "http"
inputs = ["filter_debug"]
uri = "https://internal-gateway.oasis-siem.local/ingest"  # Internal gateway URL
method = "post"
compression = "gzip"
encoding.codec = "json"
batch.max_bytes = 1048576  # 1MB
batch.timeout_secs = 5

# Authentication: API key header
[sinks.oasis_gateway.request.headers]
X-API-Key = "${OASIS_API_KEY}"  # Set via environment variable: export OASIS_API_KEY=oasis_pk_...
Content-Type = "application/json"

# TLS: Trust O.A.S.I.S. self-signed CA
[sinks.oasis_gateway.tls]
ca_file = "/etc/vector/certs/oasis-ca.pem"  # Download from O.A.S.I.S. UI
verify_certificate = true
verify_hostname = true

# Buffer: Local disk buffer for reliability
[sinks.oasis_gateway.buffer]
type = "disk"
max_size = 268435456  # 256MB
when_full = "block"
