# Vector Configuration: macOS Unified Log - PRODUCTION (YAML FORMAT)
# Collect macOS Unified Log and send to O.A.S.I.S. via HTTPS with TLS
# 
# IMPORTANT: Use the automated deployment script for easiest installation:
#   sudo bash scripts/deploy-vector.sh
#
# Manual deployment instructions (if not using script):
# 1. Install Vector via Homebrew (REQUIRED for macOS - official installer doesn't support Intel Macs):
#    brew tap vectordotdev/brew && brew install vector
# 2. Copy this file to /opt/homebrew/etc/vector/vector.yaml (Apple Silicon)
#    OR /usr/local/etc/vector/vector.yaml (Intel Mac)
# 3. Create secrets file at same location with: {"oasis_api_key": "your_key_here"}
# 4. Copy CA certificate to /opt/homebrew/etc/vector/certs/oasis-ca.pem
# 5. Create LaunchDaemon at /Library/LaunchDaemons/io.vector.agent.plist
# 6. Load with: sudo launchctl load /Library/LaunchDaemons/io.vector.agent.plist

# Secrets backend (file-based for security)
secret:
  oasis_secrets:
    type: file
    path: /usr/local/etc/vector/secrets.json  # Adjust for Apple Silicon if needed

# Data source: macOS Unified Log (via `log show`)
sources:
  macos_log:
    type: exec
    mode: scheduled
    scheduled:
      exec_interval_secs: 60  # Run every 60 seconds
    command:
      - log
      - show
      - --style
      - json
      - --predicate
      - eventType == logEvent OR eventType == activityCreateEvent
      - --last
      - 1m

# Transform: Parse JSON and add metadata
transforms:
  parse_macos_log:
    type: remap
    inputs:
      - macos_log
    source: |
      parsed, err = parse_json(.message)
      if err == null {
        .timestamp = parsed.timestamp
        .subsystem = parsed.subsystem
        .category = parsed.category
        .message_text = parsed.eventMessage
        .log_type = parsed.messageType
        .process = parsed.processImagePath
      }
      .host, _ = get_hostname()
      .oasis_tenant = "internal"
      .source_type = "macos_unified_log"

  # Filter out excessive system noise
  filter_noise:
    type: filter
    inputs:
      - parse_macos_log
    condition: |
      .subsystem != "com.apple.system.logger" && 
      .log_type != "debug"

# Sink: Send to O.A.S.I.S. Internal Gateway via HTTPS
sinks:
  oasis_gateway:
    type: http
    inputs:
      - filter_noise
    uri: https://192.168.5.32:8444/api/v1/ingest
    method: post
    compression: gzip
    encoding:
      codec: json
    batch:
      max_bytes: 1048576  # 1MB
      timeout_secs: 5
    
    # Authentication: Bearer token from secrets file
    request:
      headers:
        Authorization: "Bearer SECRET[oasis_secrets.oasis_api_key]"
        Content-Type: "application/json"
    
    # TLS: Verify O.A.S.I.S. CA certificate
    tls:
      ca_file: /usr/local/etc/vector/certs/oasis-ca.pem
      verify_certificate: true
      verify_hostname: true
    
    # Buffer: Local disk buffer for reliability
    buffer:
      type: disk
      max_size: 268435488  # 256MB (adjusted to minimum required)
      when_full: block
