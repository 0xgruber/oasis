# Fluent Bit Configuration: Linux systemd Journal
# 
# Collects logs from systemd journal and forwards to O.A.S.I.S.
# Suitable for: Ubuntu, Debian, CentOS, RHEL, Fedora
#
# Installation:
#   1. Copy this file to /etc/fluent-bit/fluent-bit.conf
#   2. Copy O.A.S.I.S. CA cert to /etc/fluent-bit/oasis-ca.pem
#   3. Replace variables: OASIS_GATEWAY_HOST, OASIS_API_KEY, OASIS_TENANT_ID
#   4. Restart service: systemctl restart fluent-bit

[SERVICE]
    Flush                     5
    Daemon                    Off
    Log_Level                 info
    Log_File                  /var/log/fluent-bit/fluent-bit.log
    storage.path              /var/lib/fluent-bit/
    storage.sync              normal
    storage.checksum          off
    storage.max_chunks_up     128
    storage.backlog.mem_limit 50M

# ============================================
# Input: systemd journal logs
# ============================================
[INPUT]
    Name                      systemd
    Tag                       host.systemd
    Read_From_Tail            On
    Strip_Underscores         On
    Lowercase                 On
    storage.type              filesystem

# ============================================
# Filter: Add metadata
# ============================================
[FILTER]
    Name                      modify
    Match                     *
    Add                       tenant_id ${OASIS_TENANT_ID}
    Add                       hostname ${HOSTNAME}
    Add                       source_type systemd_journal
    Add                       agent_type fluent-bit

# ============================================
# Filter: Nest systemd fields
# ============================================
[FILTER]
    Name                      nest
    Match                     host.systemd
    Operation                 nest
    Wildcard                  *
    Nest_under                data
    Remove_prefix             _

# ============================================
# Output: O.A.S.I.S. Internal Gateway
# ============================================
[OUTPUT]
    Name                      http
    Match                     *
    Host                      ${OASIS_GATEWAY_HOST}
    Port                      ${OASIS_GATEWAY_PORT}
    URI                       /api/v1/ingest
    Format                    json
    Header                    Authorization Bearer ${OASIS_API_KEY}
    tls                       On
    tls.verify                On
    tls.ca_file               /etc/fluent-bit/oasis-ca.pem
    Retry_Limit               5
    storage.total_limit_size  500M
    net.keepalive             On
    net.keepalive_idle_timeout 30
