# Fluent Bit Configuration: Docker Container Logs
# 
# Collects logs from Docker containers and forwards to O.A.S.I.S.
# Suitable for: Docker hosts, Kubernetes nodes
#
# Installation (Host):
#   1. Copy this file to /etc/fluent-bit/fluent-bit.conf
#   2. Copy O.A.S.I.S. CA cert to /etc/fluent-bit/oasis-ca.pem
#   3. Replace variables: OASIS_GATEWAY_HOST, OASIS_API_KEY, OASIS_TENANT_ID
#   4. Restart service: systemctl restart fluent-bit
#
# Installation (Docker):
#   docker run -d \
#     -v /var/lib/docker/containers:/var/lib/docker/containers:ro \
#     -v $(pwd)/docker-logs.conf:/fluent-bit/etc/fluent-bit.conf \
#     -v $(pwd)/oasis-ca.pem:/fluent-bit/etc/oasis-ca.pem \
#     fluent/fluent-bit:3.0

[SERVICE]
    Flush                     5
    Daemon                    Off
    Log_Level                 info
    storage.path              /var/lib/fluent-bit/
    storage.max_chunks_up     128

# ============================================
# Input: Docker container logs (JSON)
# ============================================
[INPUT]
    Name                      tail
    Tag                       docker.*
    Path                      /var/lib/docker/containers/*/*.log
    Parser                    docker
    Read_From_Head            Off
    Refresh_Interval          5
    Rotate_Wait               30
    Docker_Mode               On
    storage.type              filesystem

# ============================================
# Filter: Extract container metadata
# ============================================
[FILTER]
    Name                      docker_events
    Match                     docker.*
    Parser                    docker

# ============================================
# Filter: Add metadata
# ============================================
[FILTER]
    Name                      modify
    Match                     *
    Add                       tenant_id ${OASIS_TENANT_ID}
    Add                       hostname ${HOSTNAME}
    Add                       source_type docker_container
    Add                       agent_type fluent-bit

# ============================================
# Filter: Exclude Fluent Bit's own logs
# ============================================
[FILTER]
    Name                      grep
    Match                     docker.*
    Exclude                   container_name fluent-bit

# ============================================
# Output: O.A.S.I.S. Internal Gateway
# ============================================
[OUTPUT]
    Name                      http
    Match                     *
    Host                      ${OASIS_GATEWAY_HOST}
    Port                      ${OASIS_GATEWAY_PORT}
    URI                       /api/v1/ingest
    Format                    json
    Header                    Authorization Bearer ${OASIS_API_KEY}
    tls                       On
    tls.verify                On
    tls.ca_file               /etc/fluent-bit/oasis-ca.pem
    Retry_Limit               5
    net.keepalive             On
