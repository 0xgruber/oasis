# Fluent Bit Parsers Configuration
# 
# Custom parsers for various log formats
# Place this file at: /etc/fluent-bit/parsers.conf

# ============================================
# Syslog RFC3164 (Traditional syslog)
# ============================================
[PARSER]
    Name                      syslog-rfc3164
    Format                    regex
    Regex                     /^<(?<pri>[0-9]+)>(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$/
    Time_Key                  time
    Time_Format               %b %d %H:%M:%S
    Time_Keep                 On

# ============================================
# Syslog RFC5424 (Modern syslog)
# ============================================
[PARSER]
    Name                      syslog-rfc5424
    Format                    regex
    Regex                     /^\<(?<pri>[0-9]{1,5})\>1 (?<time>[^ ]+) (?<host>[^ ]+) (?<ident>[^ ]+) (?<pid>[-0-9]+) (?<msgid>[^ ]+) (?<extradata>(\[.*\]|-)) (?<message>.+)$/
    Time_Key                  time
    Time_Format               %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep                 On

# ============================================
# JSON (Application logs)
# ============================================
[PARSER]
    Name                      json
    Format                    json
    Time_Key                  time
    Time_Format               %Y-%m-%dT%H:%M:%S.%L
    Time_Keep                 On

# ============================================
# Docker (Container logs)
# ============================================
[PARSER]
    Name                      docker
    Format                    json
    Time_Key                  time
    Time_Format               %Y-%m-%dT%H:%M:%S.%L
    Time_Keep                 On
    Decode_Field_As           escaped_utf8 log

# ============================================
# Apache Access Log
# ============================================
[PARSER]
    Name                      apache
    Format                    regex
    Regex                     /^(?<host>[^ ]*) [^ ]* (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)")?$/
    Time_Key                  time
    Time_Format               %d/%b/%Y:%H:%M:%S %z

# ============================================
# Nginx Access Log
# ============================================
[PARSER]
    Name                      nginx
    Format                    regex
    Regex                     /^(?<remote>[^ ]*) (?<host>[^ ]*) (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)")?$/
    Time_Key                  time
    Time_Format               %d/%b/%Y:%H:%M:%S %z

# ============================================
# Kubernetes (Container runtime)
# ============================================
[PARSER]
    Name                      k8s-nginx-ingress
    Format                    regex
    Regex                     /^(?<host>[^ ]*) - (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*)( +\S*)?)?" (?<code>[^ ]*) (?<size>[^ ]*) "(?<referer>[^\"]*)" "(?<agent>[^\"]*)" (?<request_length>[^ ]*) (?<request_time>[^ ]*) \[(?<proxy_upstream_name>[^ ]*)\] (\[(?<proxy_alternative_upstream_name>[^ ]*)\] )?(?<upstream_addr>[^ ]*) (?<upstream_response_length>[^ ]*) (?<upstream_response_time>[^ ]*) (?<upstream_status>[^ ]*) (?<req_id>[^ ]*).*$/
    Time_Key                  time
    Time_Format               %d/%b/%Y:%H:%M:%S %z
