# Fluent Bit Configuration: Production Linux
# 
# Comprehensive production-ready configuration for Linux servers
# Includes: systemd journal, syslog files, auth logs, custom apps
#
# Features:
#   - Multiple log sources
#   - Advanced filtering
#   - Performance optimization
#   - Security hardening
#
# Installation:
#   1. Copy this file to /etc/fluent-bit/fluent-bit.conf
#   2. Copy O.A.S.I.S. CA cert to /etc/fluent-bit/oasis-ca.pem
#   3. Copy parsers.conf to /etc/fluent-bit/parsers.conf
#   4. Restart service: systemctl restart fluent-bit

[SERVICE]
    Flush                     5
    Daemon                    Off
    Log_Level                 info
    Log_File                  /var/log/fluent-bit/fluent-bit.log
    Parsers_File              parsers.conf
    HTTP_Server               On
    HTTP_Listen               127.0.0.1
    HTTP_Port                 2020
    storage.path              /var/lib/fluent-bit/
    storage.sync              normal
    storage.checksum          off
    storage.max_chunks_up     256
    storage.backlog.mem_limit 100M
    storage.metrics           On

# ============================================
# Input: systemd journal (high-priority)
# ============================================
[INPUT]
    Name                      systemd
    Tag                       host.systemd
    Read_From_Tail            On
    Strip_Underscores         On
    Lowercase                 On
    Max_Entries               1000
    storage.type              filesystem

# ============================================
# Input: Syslog file
# ============================================
[INPUT]
    Name                      tail
    Tag                       host.syslog
    Path                      /var/log/syslog
    Parser                    syslog-rfc3164
    Read_From_Head            Off
    Refresh_Interval          5
    storage.type              filesystem

# ============================================
# Input: Authentication logs
# ============================================
[INPUT]
    Name                      tail
    Tag                       host.auth
    Path                      /var/log/auth.log
    Parser                    syslog-rfc3164
    Read_From_Head            Off
    Refresh_Interval          10
    storage.type              filesystem

# ============================================
# Input: Kernel logs
# ============================================
[INPUT]
    Name                      tail
    Tag                       host.kern
    Path                      /var/log/kern.log
    Parser                    syslog-rfc3164
    Read_From_Head            Off
    storage.type              filesystem

# ============================================
# Input: Application logs (JSON)
# ============================================
[INPUT]
    Name                      tail
    Tag                       app.custom
    Path                      /var/log/app/*.log
    Parser                    json
    Read_From_Head            Off
    storage.type              filesystem

# ============================================
# Filter: Enrich with metadata
# ============================================
[FILTER]
    Name                      modify
    Match                     *
    Add                       tenant_id ffffffff-ffff-ffff-ffff-ffffffffffff
    Add                       hostname ${HOSTNAME}
    Add                       agent_type fluent-bit
    Add                       environment production

# ============================================
# Filter: Add source type based on tag
# ============================================
[FILTER]
    Name                      modify
    Match                     host.systemd
    Add                       source_type systemd_journal

[FILTER]
    Name                      modify
    Match                     host.syslog
    Add                       source_type syslog_file

[FILTER]
    Name                      modify
    Match                     host.auth
    Add                       source_type auth_log
    Add                       log_category security

[FILTER]
    Name                      modify
    Match                     host.kern
    Add                       source_type kernel_log
    Add                       log_category system

[FILTER]
    Name                      modify
    Match                     app.*
    Add                       source_type application
    Add                       log_category application

# ============================================
# Filter: Parse and enrich systemd logs
# ============================================
[FILTER]
    Name                      nest
    Match                     host.systemd
    Operation                 nest
    Wildcard                  *
    Nest_under                data
    Remove_prefix             _

# ============================================
# Filter: Deduplicate (prevent log storms)
# ============================================
[FILTER]
    Name                      throttle
    Match                     *
    Rate                      1000
    Window                    5
    Print_Status              true
    Interval                  60s

# ============================================
# Output: O.A.S.I.S. Internal Gateway (Primary)
# ============================================
[OUTPUT]
    Name                      http
    Match                     *
    Host                      192.168.5.32
    Port                      8444
    URI                       /api/v1/ingest
    Format                    json
    json_date_key             timestamp
    json_date_format          iso8601
    Header                    Authorization Bearer oasis_pk_FfCjHivG-Q-QN2lBD7Dl6-YQtoPaPnKEJsqXVLEkWwo
    Header                    X-Agent-Version fluent-bit-3.0
    tls                       On
    tls.verify                On
    tls.ca_file               /etc/fluent-bit/oasis-ca.pem
    Retry_Limit               10
    storage.total_limit_size  1G
    net.keepalive             On
    net.keepalive_idle_timeout 30
    net.keepalive_max_recycle  2000
    Workers                   4

# ============================================
# Output: Local file backup (optional)
# ============================================
[OUTPUT]
    Name                      file
    Match                     host.auth
    Path                      /var/log/fluent-bit/auth-backup
    Format                    json
