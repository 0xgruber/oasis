# Fluent Bit Configuration: Windows Event Logs
# 
# Collects Windows Event Logs and forwards to O.A.S.I.S.
# Suitable for: Windows Server 2016+, Windows 10+
#
# Installation:
#   1. Copy this file to C:\fluent-bit\conf\fluent-bit.conf
#   2. Copy O.A.S.I.S. CA cert to C:\fluent-bit\conf\oasis-ca.pem
#   3. Replace variables: OASIS_GATEWAY_HOST, OASIS_API_KEY, OASIS_TENANT_ID
#   4. Restart service: Restart-Service fluent-bit
#
# Note: Use forward slashes (/) or double backslashes (\\) for Windows paths

[SERVICE]
    Flush                     5
    Daemon                    Off
    Log_Level                 info
    Log_File                  C:/ProgramData/fluent-bit/logs/fluent-bit.log
    storage.path              C:/ProgramData/fluent-bit/storage/
    storage.max_chunks_up     128
    storage.backlog.mem_limit 50M

# ============================================
# Input: Windows Event Log - System
# ============================================
[INPUT]
    Name                      winlog
    Tag                       windows.system
    Channels                  System
    Interval_Sec              1
    Read_Existing_Events      Off
    storage.type              filesystem

# ============================================
# Input: Windows Event Log - Application
# ============================================
[INPUT]
    Name                      winlog
    Tag                       windows.application
    Channels                  Application
    Interval_Sec              1
    Read_Existing_Events      Off
    storage.type              filesystem

# ============================================
# Input: Windows Event Log - Security
# ============================================
[INPUT]
    Name                      winlog
    Tag                       windows.security
    Channels                  Security
    Interval_Sec              1
    Read_Existing_Events      Off
    storage.type              filesystem

# ============================================
# Input: Windows Event Log - PowerShell
# ============================================
[INPUT]
    Name                      winlog
    Tag                       windows.powershell
    Channels                  Microsoft-Windows-PowerShell/Operational
    Interval_Sec              2
    Read_Existing_Events      Off
    storage.type              filesystem

# ============================================
# Filter: Add metadata
# ============================================
[FILTER]
    Name                      modify
    Match                     *
    Add                       tenant_id ${OASIS_TENANT_ID}
    Add                       hostname ${COMPUTERNAME}
    Add                       source_type windows_eventlog
    Add                       agent_type fluent-bit
    Add                       os_type Windows

# ============================================
# Filter: Add channel-specific metadata
# ============================================
[FILTER]
    Name                      modify
    Match                     windows.system
    Add                       log_category system

[FILTER]
    Name                      modify
    Match                     windows.application
    Add                       log_category application

[FILTER]
    Name                      modify
    Match                     windows.security
    Add                       log_category security
    Add                       priority high

[FILTER]
    Name                      modify
    Match                     windows.powershell
    Add                       log_category powershell
    Add                       priority high

# ============================================
# Output: O.A.S.I.S. Internal Gateway
# ============================================
[OUTPUT]
    Name                      http
    Match                     *
    Host                      ${OASIS_GATEWAY_HOST}
    Port                      ${OASIS_GATEWAY_PORT}
    URI                       /api/v1/ingest
    Format                    json
    Header                    Authorization Bearer ${OASIS_API_KEY}
    tls                       On
    tls.verify                On
    tls.ca_file               C:/fluent-bit/conf/oasis-ca.pem
    Retry_Limit               5
    storage.total_limit_size  500M
    net.keepalive             On
    net.keepalive_idle_timeout 30
