# Fluent Bit Configuration: Linux Syslog Files
# 
# Collects logs from syslog files and forwards to O.A.S.I.S.
# Suitable for: Systems without systemd, legacy syslog configurations
#
# Installation:
#   1. Copy this file to /etc/fluent-bit/fluent-bit.conf
#   2. Copy O.A.S.I.S. CA cert to /etc/fluent-bit/oasis-ca.pem
#   3. Replace variables: OASIS_GATEWAY_HOST, OASIS_API_KEY, OASIS_TENANT_ID
#   4. Restart service: systemctl restart fluent-bit

[SERVICE]
    Flush                     5
    Daemon                    Off
    Log_Level                 info
    Parsers_File              parsers.conf
    storage.path              /var/lib/fluent-bit/
    storage.sync              normal
    storage.max_chunks_up     128

# ============================================
# Input: Syslog file
# ============================================
[INPUT]
    Name                      tail
    Tag                       host.syslog
    Path                      /var/log/syslog
    Parser                    syslog-rfc3164
    Read_From_Head            Off
    Refresh_Interval          5
    storage.type              filesystem

# ============================================
# Input: Auth log file
# ============================================
[INPUT]
    Name                      tail
    Tag                       host.auth
    Path                      /var/log/auth.log
    Parser                    syslog-rfc3164
    Read_From_Head            Off
    storage.type              filesystem

# ============================================
# Filter: Add metadata
# ============================================
[FILTER]
    Name                      modify
    Match                     *
    Add                       tenant_id ${OASIS_TENANT_ID}
    Add                       hostname ${HOSTNAME}
    Add                       source_type syslog_file
    Add                       agent_type fluent-bit

# ============================================
# Output: O.A.S.I.S. Internal Gateway
# ============================================
[OUTPUT]
    Name                      http
    Match                     *
    Host                      ${OASIS_GATEWAY_HOST}
    Port                      ${OASIS_GATEWAY_PORT}
    URI                       /api/v1/ingest
    Format                    json
    Header                    Authorization Bearer ${OASIS_API_KEY}
    tls                       On
    tls.verify                On
    tls.ca_file               /etc/fluent-bit/oasis-ca.pem
    Retry_Limit               5
    net.keepalive             On
