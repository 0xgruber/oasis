
#############################################################################
# O.A.S.I.S. - Development Environment
# Three-subnet architecture: DMZ, Internal, Backend
#############################################################################

networks:
  dmz-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  
  internal-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
  
  backend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24

volumes:
  clickhouse-data:
  postgresql-data:
  qdrant-data:
  redis-data:

services:
  #############################################################################
  # DMZ Subnet - Internet-Facing
  #############################################################################
  
  external-gateway:
    build:
      context: ./services/external-gateway
      dockerfile: Dockerfile
    container_name: oasis-external-gateway
    hostname: external-gateway
    restart: unless-stopped
    networks:
      dmz-network:
        ipv4_address: 172.20.0.10
      backend-network:
        ipv4_address: 172.22.0.10
    ports:
      - "8443:8000"     # HTTP API (app runs on 8000 inside container)
      - "514:514/udp"   # Syslog UDP
      - "514:514/tcp"   # Syslog TCP
      - "6514:6514/tcp" # Syslog TLS
    environment:
      - GATEWAY_TYPE=external
      - GATEWAY_NAME=External Gateway
      - POSTGRES_HOST=postgresql
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-oasis}
      - POSTGRES_USER=${POSTGRES_USER:-gateway_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - INGESTION_SERVICE_URL=https://ingestion-service:8080
      - MTLS_CERT_PATH=/certs/gateway/gateway.crt
      - MTLS_KEY_PATH=/certs/gateway/gateway.key
      - MTLS_CA_PATH=/certs/ca/oasis-ca.crt
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./infrastructure/certs-new:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgresql:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
  
  #############################################################################
  # Internal Subnet - Corporate Network
  #############################################################################
  
  internal-gateway:
    build:
      context: ./services/internal-gateway
      dockerfile: Dockerfile
    container_name: oasis-internal-gateway
    hostname: internal-gateway
    restart: unless-stopped
    networks:
      internal-network:
        ipv4_address: 172.21.0.10
      backend-network:
        ipv4_address: 172.22.0.11
    ports:
      - "8444:8000"      # HTTP API (app runs on 8000 inside container)
      - "1514:514/udp"   # Syslog UDP (different host port to avoid conflict)
      - "1514:514/tcp"   # Syslog TCP
      - "7514:6514/tcp"  # Syslog TLS
    environment:
      - GATEWAY_TYPE=internal
      - GATEWAY_NAME=Internal Gateway
      - POSTGRES_HOST=postgresql
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-oasis}
      - POSTGRES_USER=${POSTGRES_USER:-gateway_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - INGESTION_SERVICE_URL=https://ingestion-service:8080
      - MTLS_CERT_PATH=/certs/gateway/gateway.crt
      - MTLS_KEY_PATH=/certs/gateway/gateway.key
      - MTLS_CA_PATH=/certs/ca/oasis-ca.crt
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./infrastructure/certs-new:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgresql:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
  
  soc-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: oasis-soc-portal
    hostname: soc-portal
    restart: unless-stopped
    networks:
      internal-network:
        ipv4_address: 172.21.0.20
      backend-network:
        ipv4_address: 172.22.0.20
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # Browser clients must not use `localhost` (points to the viewer's machine).
      # Use same-origin proxy via Next.js rewrite.
      - NEXT_PUBLIC_API_BASE_URL=/api
      # Internal destination for the rewrite (container network).
      - API_INTERNAL_URL=http://api-service:8000
      # Needed for accessing Next dev server from non-localhost origins (e.g. Tailscale).
      - ALLOWED_DEV_ORIGINS=${ALLOWED_DEV_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://100.87.181.14:3000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      api-service:
        condition: service_healthy
  
  #############################################################################
  # Backend Subnet - Database & Services
  #############################################################################
  
  ingestion-service:
    build:
      context: ./services/ingestion-service
      dockerfile: Dockerfile
    container_name: oasis-ingestion-service
    hostname: ingestion-service
    restart: unless-stopped
    networks:
      backend-network:
        ipv4_address: 172.22.0.30
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-oasis}
      - CLICKHOUSE_USER=${CLICKHOUSE_ADMIN_USER:-admin}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_ADMIN_PASSWORD:-changeme}
      - POSTGRES_HOST=postgresql
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-oasis}
      - POSTGRES_USER=${POSTGRES_USER:-ingestion_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - MTLS_CERT_PATH=/certs/ingestion/ingestion.crt
      - MTLS_KEY_PATH=/certs/ingestion/ingestion.key
      - MTLS_CA_PATH=/certs/ca/oasis-ca.crt
      - BATCH_SIZE=${BATCH_SIZE:-1000}
      - BATCH_TIMEOUT_SECONDS=${BATCH_TIMEOUT_SECONDS:-5}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./infrastructure/certs-new:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    depends_on:
      clickhouse:
        condition: service_healthy
      postgresql:
        condition: service_healthy
  
  api-service:
    build:
      context: ./services/api-service
      dockerfile: Dockerfile
    container_name: oasis-api-service
    hostname: api-service
    restart: unless-stopped
    networks:
      backend-network:
        ipv4_address: 172.22.0.40
    ports:
      - "8000:8000"  # API HTTP (for frontend access)
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-oasis}
      - CLICKHOUSE_USER=${CLICKHOUSE_ADMIN_USER:-admin}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_ADMIN_PASSWORD:-changeme}
      - POSTGRES_HOST=postgresql
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-oasis}
      - POSTGRES_USER=${POSTGRES_USER:-api_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      # Comma-separated list of allowed browser origins (CORS)
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - JWT_SECRET=${JWT_SECRET:-changeme-generate-secure-secret}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_MINUTES=60
      - TOTP_ISSUER=O.A.S.I.S.
      - METRICS_SERVICE_URL=http://metrics-service:8001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    depends_on:
      clickhouse:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      metrics-service:
        condition: service_healthy
  
  metrics-service:
    build:
      context: ./services/metrics-service
      dockerfile: Dockerfile
    container_name: oasis-metrics-service
    hostname: metrics-service
    restart: unless-stopped
    networks:
      backend-network:
        ipv4_address: 172.22.0.41
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-oasis}
      - CLICKHOUSE_USER=${CLICKHOUSE_ADMIN_USER:-admin}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_ADMIN_PASSWORD:-changeme}
      - POSTGRES_HOST=postgresql
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-oasis}
      - POSTGRES_USER=${POSTGRES_USER:-api_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_TTL_SYSTEM_METRICS=30
      - CACHE_TTL_TENANT_METRICS=30
      - CACHE_TTL_AGENT_METRICS=60
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    depends_on:
      clickhouse:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  #############################################################################
  # Databases
  #############################################################################
  
  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: oasis-clickhouse
    hostname: clickhouse
    restart: unless-stopped
    networks:
      backend-network:
        ipv4_address: 172.22.0.50
    ports:
      - "8123:8123"  # HTTP interface (for dev/debugging)
      - "9000:9000"  # Native TCP
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-oasis}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_USER=${CLICKHOUSE_ADMIN_USER:-admin}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_ADMIN_PASSWORD:-changeme}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infrastructure/clickhouse/config.xml:/etc/clickhouse-server/config.d/oasis.xml:ro
      - ./infrastructure/clickhouse/users.xml:/etc/clickhouse-server/users.d/oasis.xml:ro
      - ./infrastructure/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 8G
  
  postgresql:
    image: postgres:16-alpine
    container_name: oasis-postgresql
    hostname: postgresql
    restart: unless-stopped
    networks:
      backend-network:
        ipv4_address: 172.22.0.60
    ports:
      - "15432:5432"  # PostgreSQL (for dev/debugging) - using 15432 to avoid conflict
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-oasis}
      - POSTGRES_USER=${POSTGRES_ADMIN_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD:-changeme}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - ./infrastructure/postgresql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-admin} -d ${POSTGRES_DB:-oasis}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
  
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: oasis-qdrant
    hostname: qdrant
    restart: unless-stopped
    networks:
      backend-network:
        ipv4_address: 172.22.0.70
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
  
  redis:
    image: redis:7-alpine
    container_name: oasis-redis
    hostname: redis
    restart: unless-stopped
    networks:
      backend-network:
        ipv4_address: 172.22.0.80
    ports:
      - "6379:6379"  # Redis (for dev/debugging)
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
